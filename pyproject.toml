[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freegraph"
version = "0.0.3"
description = "Zero-dependency, zero-account, zero-egress graph runtime kernel — a drop-in replacement for the LangGraph Graph API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "杨家成" }]
keywords = [
    "langgraph",
    "graph",
    "state-graph",
    "agent",
    "workflow",
    "otel",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# 立项书 §5.5：基础安装**零第三方运行时依赖**。
# 2026-11-05（宪法 v1.2.0）：原为 ["typing-extensions>=4.7.0"]——
# 该依赖的存在理由（"`typing.Self` 在 3.10 起可用"）经实测**不成立**
# （`typing.Self` 是 3.11 才有的），且实测 3.10/3.11 的标准库足以支撑
# v1 全部 31 个 feature 的 typing 需求（详见宪法修订记录 v1.2.0 与
# specs/b1f1-contracts-core/research.md 的 D-21）。基础安装依赖闭包 MUST 为空集
# （由 tests/contracts/test_architecture.py 的 G3 门禁断言）。
dependencies = []

# **v1.0 的依赖面 = 零**（宪法 v1.7.0 · 发起者 2026-11-08 决定）。
#
# 「freegraph v1.0 不希望看到依赖包，所有依赖包放到 v2.0」⇒
# v1.0 的**发行元数据 MUST NOT 出现任何依赖包名** ⇒ 本文件**不含**
# `[project.optional-dependencies]`。
#
# **v2.0 的四个可选 extra**（`[pydantic]` / `[checkpoint]` / `[otel]` / `[png]`）
# 声明在 **`specs/b3f1-scaffold-ci-gates/contracts/extras-v2.toml`**
# （**不进发行包** · 刻意采用 `pyproject` 的同构形态）⇒
# 门禁 **G21 / G23** 对该清单**取证** ⇒ v1.0 就完成**预验证**（许可证 / 黑名单），
# v2.0 落地时只需把清单搬进本节 ⇒ **门禁实现零改动**。
#
# **四个 extra 均非内核的必要条件**（实测：内核与契约层对这四个包**零引用**，
# 契约层只用标准库）⇒ 移走它们**不阻断**任何 v1.0 内核里程碑。

[project.urls]
Homepage = "https://github.com/yangjiacheng1996/freegraph"
Repository = "https://github.com/yangjiacheng1996/freegraph"
Issues = "https://github.com/yangjiacheng1996/freegraph/issues"

# 开发期依赖组（PEP 735 · dependency-groups）—— **不进发行包**。
#
# 用途：跑测试套件 + 门禁脚本。`pytest` 是测试运行时；`packaging>=24.2` 供 G23 的
# SPDX 表达式解析（`packaging.licenses` 模块自 24.2 才存在 · research D-05 实测）。
#
# 三条纪律：
#   1. **不是 extra** ⇒ 不进 `Requires-Dist` ⇒ 基础安装闭包仍为空集（宪法 v1.2.0 · G3）
#      **且不参与 extras 变体枚举**（dependency-gate.md §2.2）⇒ 不影响 G3 的 12 名白名单；
#   2. **不进发行包** —— hatchling 不把 dependency-groups 写进 wheel/sdist 的元数据
#      ⇒ 发行产物纯度门禁（harness/scripts/check_dist_purity.py）不受影响；
#   3. 安装方式：`uv pip install --group dev`（实测 uv 0.12.7 支持 · 2026-11-07）。
[dependency-groups]
dev = [
    "pytest>=7.4",
    "packaging>=24.2",
]

# **差分测试夹具**的依赖组（PEP 735 · **不进发行包**）—— 属 **B5F2**。
#
# 用途：让 `tests/differential/` 的差分夹具能**真实执行**（同一份图规格分别在
# `langgraph` 与 `freegraph` 上跑 ⇒ 比对「节点入参 / 输出状态 / 事件序列」三项投影）。
#
# 四条纪律：
#   1. **不是 extra** ⇒ 不进 `Requires-Dist` ⇒ 发行元数据**整体为空**（宪法 v1.7.0 · G3 / G21）
#      ⇒ 基础安装闭包仍为空集；
#   2. **不进发行包** —— hatchling 不把 dependency-groups 写进 wheel/sdist 的元数据
#      ⇒ 发行产物纯度门禁不受影响；
#   3. **钉版本** —— `langgraph==1.2.11` 与 `contracts/upstream-parity.md` 的**核实版本**逐字一致
#      ⇒ 换版本 MUST **重新核实全部行号**（宪法原则 VIII）；
#   4. **仅测试侧** —— MUST NOT 进 `[project].dependencies` / `[project.optional-dependencies]`
#      ⇒ 内核路径对上游的导入次数恒为 **0**。
#
# ⚠️ **缺席即 skip**（FR-019 · 裁定 11）：未装该组的环境里，差分用例被**标记跳过**
# ⇒ **不是失败**（CI 的步骤 5.6 装上该组 ⇒ 差分用例**真实执行** ⇒ SC-014 可达）。
differential = [
    "langgraph==1.2.11",
]

[tool.pytest.ini_options]
# 收集范围**钉死**在 `tests/` ⇒ 裁定 16 的「核心用例 = 全量测试套件」有确定含义
# （harness/ 下的脚本与门禁**不是**测试用例；tests/ 下的三个目录各自是一层门禁）。
testpaths = ["tests"]
# `-ra` ⇒ 汇总输出所有非通过结果（含 skip / xfail / 失败原因）。
addopts = "-ra"
# 严格 xfail：被标记为 xfail 的用例若意外通过 ⇒ **判失败**（防止「假绿」）。
xfail_strict = true
# 平台专属用例的过滤依据（tasks T001 · 契约 ci-matrix §1）。
#   linux_only    —— 需 Linux 隔离环境 / 网络命名空间（G22 · G28 一族）；
#   full_install —— 需装齐四个 extras 的完整安装环境（**当前无使用者**·预留）。
# 非 Linux 作业的 pytest 步骤用 `-m "not linux_only and not full_install"` 排除。
markers = [
    "linux_only: 需 Linux 隔离环境 / 网络命名空间",
    "full_install: 需装齐四个 extras 的完整安装环境",
]

[tool.hatch.build.targets.wheel]
packages = ["src/freegraph"]

# sdist 只含包代码与必要元数据。
# 仓库里的 harness/（调研报告 / 提示词 / 立项书 / 验收脚本）、.specify/（宪法与
# spec 模板）、.opencode/（speckit 命令）是**开发辅助材料**——它们留在 GitHub 上供
# 读者学习全部原理，但绝不能进入 PyPI 发行包（否则会被别人 import 引入）。
# only-include 已限定范围，exclude 再兜一层；最终由 harness/scripts/check_dist_purity.py
# 在发布流水线里断言（见 .github/workflows/publish.yml）。
[tool.hatch.build.targets.sdist]
only-include = ["src/freegraph", "README.md", "LICENSE"]
exclude = [
    "/.opencode",
    "/.specify",
    "/.harness",
    "/harness",
    "/.github",
    "/specs",
    "/dist",
    "/tests",
    "**/node_modules",
    "**/__pycache__",
]
