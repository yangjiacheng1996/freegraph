[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "freegraph"
version = "0.0.3"
description = "Zero-dependency, zero-account, zero-egress graph runtime kernel — a drop-in replacement for the LangGraph Graph API."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "杨家成" }]
keywords = [
    "langgraph",
    "graph",
    "state-graph",
    "agent",
    "workflow",
    "otel",
    "opentelemetry",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

# 立项书 §5.5：基础安装**零第三方运行时依赖**。
# 2026-11-05（宪法 v1.2.0）：原为 ["typing-extensions>=4.7.0"]——
# 该依赖的存在理由（"`typing.Self` 在 3.10 起可用"）经实测**不成立**
# （`typing.Self` 是 3.11 才有的），且实测 3.10/3.11 的标准库足以支撑
# v1 全部 31 个 Phase 的 typing 需求（详见宪法修订记录 v1.2.0 与
# specs/001-p01-contracts-core/research.md 的 D-21）。基础安装依赖闭包 MUST 为空集
# （由 tests/contracts/test_architecture.py 的 G3 门禁断言）。
dependencies = []

[project.urls]
Homepage = "https://github.com/yangjiacheng1996/freegraph"
Repository = "https://github.com/yangjiacheng1996/freegraph"
Issues = "https://github.com/yangjiacheng1996/freegraph/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/freegraph"]

# sdist 只含包代码与必要元数据。
# 仓库里的 harness/（调研报告 / 提示词 / 立项书 / 验收脚本）、.specify/（宪法与
# spec 模板）、.opencode/（speckit 命令）是**开发辅助材料**——它们留在 GitHub 上供
# 读者学习全部原理，但绝不能进入 PyPI 发行包（否则会被别人 import 引入）。
# only-include 已限定范围，exclude 再兜一层；最终由 harness/scripts/check_dist_purity.py
# 在发布流水线里断言（见 .github/workflows/publish.yml）。
[tool.hatch.build.targets.sdist]
only-include = ["src/freegraph", "README.md", "LICENSE"]
exclude = [
    "/.opencode",
    "/.specify",
    "/.harness",
    "/harness",
    "/.github",
    "/specs",
    "/dist",
    "/tests",
    "**/node_modules",
    "**/__pycache__",
]
