name: publish

# 用 PyPI 的 Trusted Publishing（OIDC）发布：**不需要 API token，也不需要密码**。
#
# 前置条件（在 PyPI 网页端一次性配置）：
#   账号侧边栏 → "Publishing" → Add GitHub Actions publisher
#     PyPI project name : freegraph        （项目不存在时这里注册的是 "pending" publisher）
#     Repository owner  : yangjiacheng1996
#     Repository name    : freegraph
#     Workflow filename  : publish.yml
#     Environment name   : pypi              （与下面 job 的 environment 对应）
#
# 首次运行成功后，pending publisher 会自动转成正式 publisher，项目随之创建。

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/freegraph
    permissions:
      # 注意：job 级 permissions 会**完全覆盖**顶层同名键，
      # 未列出的 scope 一律变成 none —— 所以 contents: read 必须在这里重复声明，
      # 否则 actions/checkout 拿不到仓库内容（403）。
      contents: read   # actions/checkout 需要
      id-token: write # Trusted Publishing 必需
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3  # 该项目只提供到 v7 的浮动 major 标签，v10 需钉具体版本
        with:
          enable-cache: true

      - name: Build
        run: uv build

      # 发行产物纯度门禁：PyPI 上的包必须只有 src/ 下的包代码与必要元数据。
      # 仓库里的 harness/（调研报告 / 提示词 / 立项书 / 验收脚本）、.specify/（宪法）、
      # .opencode/（speckit 命令）是开发辅助材料——它们留在 GitHub 上供读者学习全部原理，
      # 但绝不能进入发行包（否则会被别人 import 引入）。
      # 这一步失败即中止发布：PyPI 上的版本一旦发布**不可删除**，只能 yank。
      - name: Verify artifact purity
        # 解释器按可用性三级回退：python3 → python → uv。
        #   · runner 镜像不保证提供 `python` 这个名字（未跑 actions/setup-python 时尤其如此），
        #     单押一种都有 command not found 的风险；
        #   · 而这道门禁一旦挂掉就会**阻断发布**，宁可多写两行；
        #   · uv 是上一个步骤装的，它保证能解析出可用的 Python，作为最后兜底。
        # 脚本只用标准库，无版本要求。exec 让门禁的退出码直通给 job。
        run: |
          set -euo pipefail
          if command -v python3 >/dev/null 2>&1; then
            exec python3 harness/scripts/check_dist_purity.py dist/
          elif command -v python >/dev/null 2>&1; then
            exec python harness/scripts/check_dist_purity.py dist/
          else
            # 最后兜底：uv（上个步骤刚装好，且 `uv build` 已解析出可用 Python）。
            # 加 --offline：万一 uv 也找不到解释器，**快速失败**而不是联网下载挂死
            # ——门禁挂死比门禁快速失败更糟（会白烧 CI 时间且难以定位）。
            echo "::notice::未找到 python3 / python，改用 uv 运行（--offline）"
            exec uv run --offline --no-project python harness/scripts/check_dist_purity.py dist/
          fi

      - name: Publish to PyPI
        run: uv publish --trusted-publishing always
